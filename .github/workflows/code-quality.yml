name: Python CI

on:
  push:
    branches: [ main ]
  pull_request_target:
    branches: [ main ]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies with uv
        run: |
          uv sync --all-extras --dev

      - name: Run Pylint
        run: |
          uv run pylint $(git ls-files '*.py')
        continue-on-error: true

      - name: Run MyPy
        run: |
          uv run mypy . --ignore-missing-imports
        continue-on-error: true

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: "ci-secret-key"
      DATA_DIR: "./data"
      FILE_BASE_DIR: "."
      BOOTSTRAP_USER_EMAIL: "bootstrap1@example.com"
      BOOTSTRAP_USER_PASSWORD: "bootstrap-password-1"
      BOOTSTRAP_USER2_EMAIL: "bootstrap2@example.com"
      BOOTSTRAP_USER2_PASSWORD: "bootstrap-password-2"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies with uv
        run: |
          uv sync --all-extras --dev

      - name: Run Unit Tests
        run: |
          uv run pytest --verbose --maxfail=1 --disable-warnings

  codeql:
    name: CodeQL Scan
    runs-on: ubuntu-latest
    needs: unit-test

    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
